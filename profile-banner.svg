<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" role="img" aria-label="Munirul — AI-assisted developer, IoT builder, product creator">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#020617"/>
    <stop offset=".55" stop-color="#071426"/>
    <stop offset="1" stop-color="#0d1024"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee"/>
    <stop offset=".5" stop-color="#60a5fa"/>
    <stop offset="1" stop-color="#8b5cf6"/>
  </linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity=".105"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity=".035"/>
  </linearGradient>
  <radialGradient id="cyanGlow">
    <stop offset="0" stop-color="#22d3ee" stop-opacity=".28"/>
    <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="violetGlow">
    <stop offset="0" stop-color="#8b5cf6" stop-opacity=".23"/>
    <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
  </radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="35"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="8"/></filter>
  <style>
    .float{animation:float 6s ease-in-out infinite}
    .float2{animation:float2 7s ease-in-out infinite}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    .flow{stroke-dasharray:10 18;animation:flow 3.2s linear infinite}
    .scan{animation:scan 5s ease-in-out infinite}
    .blink{animation:blink 1.3s steps(2,end) infinite}
    .shimmer{animation:shimmer 4s ease-in-out infinite}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    @keyframes float2{0%,100%{transform:translate(0,0)}50%{transform:translate(4px,5px)}}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes flow{to{stroke-dashoffset:-112}}
    @keyframes scan{0%,100%{transform:translateX(0);opacity:0}45%{transform:translateX(420px);opacity:.55}52%{opacity:0}}
    @keyframes blink{0%,45%{opacity:1}46%,100%{opacity:0}}
    @keyframes shimmer{0%,100%{opacity:.82}50%{opacity:1}}
  </style>
</defs>

<rect width="1600" height="500" rx="34" fill="url(#bg)"/>

<!-- soft ambient light -->
<circle cx="170" cy="50" r="250" fill="url(#cyanGlow)" filter="url(#blur)" class="pulse"/>
<circle cx="1400" cy="420" r="270" fill="url(#violetGlow)" filter="url(#blur)" class="pulse"/>
<circle cx="840" cy="240" r="240" fill="#38bdf8" opacity=".035" filter="url(#blur)"/>

<!-- micro-grid -->
<g opacity=".045" stroke="#cbd5e1">
  <path d="M0 100H1600M0 200H1600M0 300H1600M0 400H1600"/>
  <path d="M160 0V500M320 0V500M480 0V500M640 0V500M800 0V500M960 0V500M1120 0V500M1280 0V500M1440 0V500"/>
</g>

<!-- tiny header -->
<g transform="translate(72 52)">
  <circle cx="7" cy="7" r="5" fill="#34d399" class="pulse"/>
  <text x="23" y="12" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="3">MUNIRUL</text>
  <text x="115" y="12" fill="#475569" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">/</text>
  <text x="130" y="12" fill="#64748b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">BUILDER</text>
</g>

<!-- main identity -->
<g transform="translate(72 118)">
  <text x="0" y="0" fill="url(#accent)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="800" letter-spacing="2.5">AI-ASSISTED DEVELOPER</text>
  <text x="0" y="74" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="86" font-weight="850" letter-spacing="-4" class="shimmer">Munirul<tspan fill="#67e8f9">.</tspan></text>
  <text x="4" y="111" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20">IoT builder • product creator • real-world systems</text>
  <text x="4" y="145" fill="#64748b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Software × devices × spatial experiences</text>
</g>

<!-- minimal glass product card -->
<g transform="translate(905 70)" class="float">
  <rect width="610" height="255" rx="28" fill="url(#glass)" stroke="#94a3b8" stroke-opacity=".20"/>
  <rect x="1" y="1" width="608" height="253" rx="27" fill="none" stroke="#fff" stroke-opacity=".045"/>

  <text x="30" y="35" fill="#64748b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="2.5">BUILDING NOW</text>

  <text x="30" y="80" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="800">WayCampus</text>
  <text x="32" y="109" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Campus navigation, evolving toward spatial AR.</text>

  <!-- glass signal path -->
  <path d="M36 178 C105 137 165 207 230 164 S355 138 430 176 S515 197 570 148"
        fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" class="flow"/>
  <circle cx="36" cy="178" r="8" fill="#fff" stroke="#22d3ee" stroke-width="4" class="pulse"/>
  <circle cx="570" cy="148" r="8" fill="#fff" stroke="#8b5cf6" stroke-width="4" class="pulse"/>

  <text x="34" y="216" fill="#64748b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">IDEA</text>
  <text x="265" y="198" fill="#64748b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">BUILD</text>
  <text x="520" y="195" fill="#64748b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">SHIP</text>
</g>

<!-- compact tool strip -->
<g transform="translate(72 355)">
  <rect width="1443" height="70" rx="22" fill="#ffffff" fill-opacity=".045" stroke="#94a3b8" stroke-opacity=".14"/>
  <text x="24" y="29" fill="#64748b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="800" letter-spacing="2">TOOLS I BUILD WITH</text>

  <g transform="translate(180 16)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">
    <g><rect width="108" height="38" rx="19" fill="#ffffff" fill-opacity=".055" stroke="#94a3b8" stroke-opacity=".13"/><circle cx="18" cy="19" r="5" fill="#60a5fa"/><text x="31" y="24" fill="#e2e8f0">Antigravity</text></g>
    <g transform="translate(120)"><rect width="84" height="38" rx="19" fill="#ffffff" fill-opacity=".055" stroke="#94a3b8" stroke-opacity=".13"/><circle cx="18" cy="19" r="5" fill="#a78bfa"/><text x="31" y="24" fill="#e2e8f0">Stitch</text></g>
    <g transform="translate(216)"><rect width="98" height="38" rx="19" fill="#ffffff" fill-opacity=".055" stroke="#94a3b8" stroke-opacity=".13"/><circle cx="18" cy="19" r="5" fill="#22d3ee"/><text x="31" y="24" fill="#e2e8f0">Arduino</text></g>
    <g transform="translate(326)"><rect width="86" height="38" rx="19" fill="#ffffff" fill-opacity=".055" stroke="#94a3b8" stroke-opacity=".13"/><circle cx="18" cy="19" r="5" fill="#34d399"/><text x="31" y="24" fill="#e2e8f0">ESP32</text></g>
    <g transform="translate(424)"><rect width="120" height="38" rx="19" fill="#ffffff" fill-opacity=".055" stroke="#94a3b8" stroke-opacity=".13"/><circle cx="18" cy="19" r="5" fill="#fb7185"/><text x="31" y="24" fill="#e2e8f0">Raspberry Pi</text></g>
    <g transform="translate(556)"><rect width="122" height="38" rx="19" fill="#ffffff" fill-opacity=".055" stroke="#94a3b8" stroke-opacity=".13"/><circle cx="18" cy="19" r="5" fill="#fbbf24"/><text x="31" y="24" fill="#e2e8f0">AI-assisted</text></g>
  </g>
</g>

<!-- subtle animated scan -->
<rect x="70" y="350" width="8" height="80" rx="4" fill="#22d3ee" filter="url(#soft)" class="scan"/>

<text x="73" y="468" fill="#475569" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">build • test • learn • ship</text>
<text x="1390" y="468" fill="#475569" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">github.com/muni-rul</text>
</svg>