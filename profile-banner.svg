<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 520" role="img" aria-label="Muni Rul developer profile">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.52" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" x2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
    <style>
      .float{animation:float 5s ease-in-out infinite}
      .float2{animation:float2 6s ease-in-out 1s infinite}
      .pulse{animation:pulse 2.6s ease-in-out infinite}
      .dash{stroke-dasharray:10 13;animation:dash 3s linear infinite}
      .blink{animation:blink 1.2s steps(2,end) infinite}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
      @keyframes float2{0%,100%{transform:translateY(0)}50%{transform:translateY(10px)}}
      @keyframes pulse{0%,100%{opacity:.28}50%{opacity:.72}}
      @keyframes dash{to{stroke-dashoffset:-69}}
      @keyframes blink{0%,45%{opacity:1}46%,100%{opacity:.1}}
    </style>
  </defs>

  <rect width="1400" height="520" rx="34" fill="url(#bg)"/>
  <circle cx="160" cy="85" r="130" fill="#22d3ee" opacity=".14" filter="url(#blur)" class="pulse"/>
  <circle cx="1240" cy="420" r="150" fill="#6366f1" opacity=".12" filter="url(#blur)" class="pulse"/>

  <g opacity=".065" stroke="#fff">
    <path d="M0 104H1400M0 208H1400M0 312H1400M0 416H1400"/>
    <path d="M200 0V520M400 0V520M600 0V520M800 0V520M1000 0V520M1200 0V520"/>
  </g>

  <g transform="translate(76 72)" class="float">
    <circle cx="42" cy="42" r="42" fill="#07101f" stroke="#334155" stroke-width="2"/>
    <path d="M42 11 52 31 73 42 52 53 42 74 32 53 11 42 32 31Z" fill="url(#cyan)"/>
    <circle cx="42" cy="42" r="8" fill="#fff"/>
  </g>

  <text x="165" y="92" fill="#67e8f9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4">MUNI RUL // BUILDER MODE</text>
  <text x="165" y="160" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="68" font-weight="800" letter-spacing="-2">Build. Ship. Repeat.</text>
  <text x="168" y="205" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24">Software • spatial computing • campus navigation • product building</text>

  <g transform="translate(165 250)" class="float2">
    <rect width="560" height="192" rx="24" fill="#020617" stroke="#334155"/>
    <circle cx="25" cy="23" r="6" fill="#fb7185"/>
    <circle cx="45" cy="23" r="6" fill="#fbbf24"/>
    <circle cx="65" cy="23" r="6" fill="#34d399"/>
    <text x="28" y="59" fill="#64748b" font-family="monospace" font-size="14">muni-rul://developer</text>
    <text x="28" y="93" fill="#67e8f9" font-family="monospace" font-size="17">$ whoami</text>
    <text x="28" y="122" fill="#e2e8f0" font-family="monospace" font-size="17">builder + student + founder-in-progress</text>
    <text x="28" y="151" fill="#a7f3d0" font-family="monospace" font-size="17">$ ship --project WayCampus</text>
    <text x="28" y="180" fill="#c4b5fd" font-family="monospace" font-size="17">✓ navigation systems online</text>
  </g>

  <g transform="translate(790 245)">
    <rect width="530" height="198" rx="26" fill="#08101f" stroke="#334155"/>
    <text x="28" y="42" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">CURRENT BUILD SIGNAL</text>
    <path d="M50 140 C118 86 176 150 240 101 S371 50 478 116" fill="none" stroke="#22d3ee" stroke-width="7" stroke-linecap="round" class="dash"/>
    <circle cx="50" cy="140" r="10" fill="#fff" stroke="#22d3ee" stroke-width="5"/>
    <circle cx="478" cy="116" r="10" fill="#fff" stroke="#6366f1" stroke-width="5"/>
    <text x="28" y="174" fill="#e2e8f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">React • TypeScript • Three.js</text>
    <text x="28" y="199" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Future focus: markerless AR wayfinding <tspan class="blink">▋</tspan></text>
  </g>

  <text x="76" y="482" fill="#64748b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">github.com/muni-rul • portfolio profile</text>
</svg>